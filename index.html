<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinBites - Financial News & Verification Engine</title>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --success: #22c55e;
            --warning: #f59e0b;
            --border: #334155;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 24px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 32px;
        }

        h1 {
            font-size: 32px;
            color: var(--accent);
            margin-bottom: 8px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 16px;
        }

        .input-panel {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 32px;
        }

        textarea {
            width: 100%;
            height: 90px;
            background: #0f172a;
            border: 1px solid var(--border);
            color: var(--text-main);
            border-radius: 8px;
            padding: 12px;
            box-sizing: border-box;
            font-size: 14px;
            resize: vertical;
        }

        button {
            background: var(--accent);
            color: #0f172a;
            font-weight: 700;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 12px;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .badge-container {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .badge {
            font-size: 11px;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .badge-verified {
            background: rgba(34, 197, 94, 0.15);
            color: var(--success);
            border: 1px solid var(--success);
        }

        .badge-single {
            background: rgba(245, 158, 11, 0.15);
            color: var(--warning);
            border: 1px solid var(--warning);
        }

        .card-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .card-section {
            margin-top: 12px;
        }

        .section-label {
            font-size: 12px;
            color: var(--accent);
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        p, ul {
            font-size: 14px;
            color: var(--text-muted);
            margin: 0;
            padding-left: 18px;
        }

        li {
            margin-bottom: 4px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>⚡ FinBites - Automated Finance News & Verification Engine</h1>
        <p class="subtitle">Multi-source economic news aggregator with cross-outlet consensus verification</p>
    </header>

    <div class="input-panel">
        <label class="section-label" style="display: block; margin-bottom: 8px;">Parse & Verify Economic Announcement</label>
        <textarea id="newsInput" placeholder="Paste headline or news excerpt from Moneycontrol, Screener, or Economic Times..."></textarea>
        <button onclick="processNews()">Verify Consensus & Impact</button>
    </div>

    <div class="grid" id="newsGrid"></div>
</div>

<script src="app.js"></script>
</body>
</html>
