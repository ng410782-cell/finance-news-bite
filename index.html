<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinBites - Simplified Financial News for Students</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-green: #22c55e;
            --border-color: #334155;
        }

        body {
            font-family: 'Segoe UI', Roboto, -apple-system, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 24px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 28px;
        }

        h1 {
            font-size: 36px;
            color: var(--accent-blue);
            margin: 0 0 8px 0;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 16px;
            margin: 0;
        }

        /* Filter Controls */
        .controls {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 32px;
        }

        .tab-btn {
            background: var(--card-bg);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 10px 24px;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background: var(--accent-blue);
            color: #0f172a;
            border-color: var(--accent-blue);
        }

        /* News Cards Grid */
        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 24px;
        }

        .news-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            transition: transform 0.2s ease;
        }

        .news-card:hover {
            transform: translateY(-4px);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .region-badge {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            padding: 4px 10px;
            border-radius: 20px;
            background: rgba(56, 189, 248, 0.15);
            color: var(--accent-blue);
            border: 1px solid var(--accent-blue);
        }

        .verified-tag {
            font-size: 11px;
            color: var(--accent-green);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .news-title {
            font-size: 18px;
            font-weight: 700;
            line-height: 1.4;
            margin-bottom: 14px;
            color: var(--text-main);
        }

        .section-title {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--accent-blue);
            margin-top: 14px;
            margin-bottom: 6px;
        }

        .summary-text, .importance-text {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.5;
            margin: 0;
        }

        .card-footer {
            margin-top: 20px;
            padding-top: 14px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .source-name {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .source-link {
            color: var(--accent-blue);
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
        }

        .source-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>⚡ FinBites</h1>
        <p class="subtitle">Complex global finance news explained simply for students — without the technical jargon.</p>
    </header>

    <div class="controls">
        <button class="tab-btn active" onclick="filterNews('all', this)">All News</button>
        <button class="tab-btn" onclick="filterNews('domestic', this)">🇮🇳 Domestic (India)</button>
        <button class="tab-btn" onclick="filterNews('international', this)">🌐 International</button>
    </div>

    <div class="news-grid" id="newsContainer"></div>
</div>

<script src="app.js"></script>
</body>
</html>
